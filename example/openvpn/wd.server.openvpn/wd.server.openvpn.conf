port    3389
server  172.27.213.0 255.255.255.128
proto   tcp
dev     tun

ca      /data/openvpn/conf/wd.server.openvpn/ca.openvpn.vpn.crt
cert    /data/openvpn/conf/wd.server.openvpn/wd.server.openvpn.crt
# 私钥需要保密。
key     /data/openvpn/conf/wd.server.openvpn/wd.server.openvpn.key
# Diffie-Hellman parameters 需要保密。
dh      /data/openvpn/conf/wd.server.openvpn/wd.server.openvpn.dh

status                  /data/openvpn/log/wd.server.openvpn.status.txt
log                     /data/openvpn/log/wd.server.openvpn.txt
