ifconfig-pool-persist   /data/openvpn/tmp/wd.server.openvpn.ipp

client-to-client
comp-lzo
verb                    6
user                    nobody
group                   nobody
client-config-dir       /data/openvpn/conf/wd.server.openvpn/ccd

