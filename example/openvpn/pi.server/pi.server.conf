############################################################
# OpenVPN 服务器端配置（pi.server）
############################################################

#===== 基本网络与监听参数 开始 =====
# 服务监听端口（缺省 TCP/UDP 1194，这里显式指定便于审查防火墙）。
port    1194

# 分配给客户端的虚拟 IP 地址池与子网掩码（第一地址留给服务器自身）。
server  172.27.16.0 255.255.255.128

# 传输层协议；与客户端 proto tcp-client 对应（这里是被动接受 TCP 连接）。
proto   tcp

# 使用 TUN（三层路由模式）虚拟设备；适合 IP 层路由方案。
dev     tun
#===== 基本网络与监听参数 结束 =====

#===== 工作目录与相对路径 开始 =====
# 切换工作目录，后续证书/密钥/参数文件可用相对路径。
cd      /data/etc/openvpn/pi.server
#===== 工作目录与相对路径 结束 =====

#===== 证书与密钥材料 开始 =====
# CA 根证书（用于验证客户端/对端证书签发链）。
ca      ca.openvpn.vpn.crt

# 服务器端实体证书（Common Name 应与部署策略匹配）。
cert    pi.server.crt

# 私钥需要保密。
key     pi.server.key

# Diffie-Hellman parameters 需要保密。
# 生成命令：openssl dhparam -out pi.server.dh 2048
dh      pi.server.dh
#===== 证书与密钥材料 结束 =====

#===== 日志与持久化元数据 开始 =====
# 运行状态（周期刷新）文件；用于监控脚本或健康检查。
status                  /data/var/log/openvpn/pi.server/pi.server.status.txt

# 主日志文件（与 log-append 同时存在时会追加写入，不截断历史）。
log                     /data/var/log/openvpn/pi.server/pi.server.txt

# 追加日志文件路径（保持历史；注意日志轮转策略）。
log-append              /data/var/log/openvpn/pi.server/pi.server.txt

# 记录已分配的客户端虚拟 IP 映射，重启后尽可能保持地址稳定。
ifconfig-pool-persist   /data/var/log/openvpn/pi.server/pi.server.ipp
#===== 日志与持久化元数据 结束 =====

#===== 多客户端交互与特性 开始 =====
# 允许不同客户端之间直接互相通信（否则只与服务器通信）。
client-to-client

# 启用 LZO 压缩（需与客户端一致；新部署可考虑关闭以减小攻击面）。
comp-lzo

# 日志详细级别（0-11；6 属于较详细，便于调试，生产可适度降低）。
verb                    6

# 降权运行的用户（初始启动需 root 建隧道，之后切换）。
user                    nobody

# 降权运行的组（与用户 nobody 配合）。
group                   nogroup

# 客户端专属配置目录（基于 Common Name 匹配对应文件）。
client-config-dir       ccd
#===== 多客户端交互与特性 结束 =====

#===== 推送到客户端的路由 开始 =====
# 向客户端推送网段 172.27.27.0/24 的静态路由。
push "route 172.27.27.0 255.255.255.0"

# 向客户端推送自身所在 VPN 子网 172.27.16.0/25 的路由；用于互访其它客户端。
push "route 172.27.16.0 255.255.255.128"
#===== 推送到客户端的路由 结束 =====