############################################################
# OpenVPN 服务器配置。
############################################################

#===== 基本模式 开始 =====
port    1194                        # 监听端口（需与客户端 remote 匹配）。
server  172.27.16.0 255.255.255.128 # 分配给 VPN 客户端的虚拟网段。
proto   tcp                         # 传输协议，需与客户端 proto 匹配。
dev     tun                         # 虚拟隧道设备类型。
#===== 基本模式 结束 =====

#===== 工作目录与相对路径 开始 =====
cd      /data/etc/openvpn/pi.server # 设定工作目录，后续相对路径基于此解析。
ca      ca.openvpn.vpn.crt          # CA 证书。
cert    pi.server.crt               # 服务器证书。
# 私钥需要保密。
key     pi.server.key               # 服务器私钥。
# Diffie-Hellman parameters 需要保密。
# 生成命令：openssl dhparam -out pi.server.dh 2048。
dh      pi.server.dh                # DH 参数。
#===== 工作目录与相对路径 结束 =====

#===== 日志与状态输出 开始 =====
status                  /data/var/log/openvpn/pi.server/pi.server.status.txt   # 运行状态文件。
log                     /data/var/log/openvpn/pi.server/pi.server.txt          # 主日志文件。
log-append              /data/var/log/openvpn/pi.server/pi.server.txt          # 追加写日志。
ifconfig-pool-persist   /data/var/log/openvpn/pi.server/pi.server.ipp          # IP 分配持久化。
#===== 日志与状态输出 结束 =====

#===== 连接与转发策略 开始 =====
client-to-client                    # 允许 VPN 客户端间互通。
comp-lzo                            # 启用 LZO 压缩（需与客户端一致）。
verb                    6           # 日志详细度（生产建议 <=4，调试可 6）。
user                    nobody      # 以低权限用户运行。
group                   nogroup     # 进程所属用户组。
client-config-dir       ccd         # 客户端专属配置目录。
#===== 连接与转发策略 结束 =====

#===== 认证与安全策略 开始 =====
script-security         3           # 允许调用自定义脚本（如认证脚本）。
#
# 注意：启用 auth-user-pass-verify 后，OpenVPN 每次认证都需 fork/exec 外部脚本。
# 若 systemd 单元文件中 LimitNPROC 过低（如默认 10），会导致“unable to fork”错误，
# 客户端无法认证登录。建议在 /etc/systemd/system/openvpn-server@pi.server.service.d/override.conf
# 中设置更高的 LimitNPROC（如 128），并重载 systemd 后重启服务：
#   [Service]
#   LimitNPROC=128
#   sudo systemctl daemon-reload && sudo systemctl restart openvpn-server@pi.server
auth-user-pass-verify /data/etc/openvpn/pi.server/pi.server.auth via-file  # 用户名密码认证脚本。
verify-client-cert require          # 强制客户端证书校验。
#===== 认证与安全策略 结束 =====

#===== 路由推送 开始 =====
push "route 172.27.27.0 255.255.255.0"      # 推送内网路由到客户端
push "route 172.27.16.0 255.255.255.128"    # 推送 VPN 网段路由
#===== 路由推送 结束 =====