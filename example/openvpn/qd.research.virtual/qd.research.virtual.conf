############################################################
# OpenVPN 客户端配置。
############################################################

#===== 基本模式 开始 =====
# 指定此配置作为客户端模式运行。
client

# 指定要连接的服务器域名与端口（可多行以做轮询，这里仅一条）。
remote          qd.ppno.net 7794

# 传输协议与角色：tcp-client 表示以客户端主动发起 TCP 连接。
proto           tcp-client

# 虚拟隧道设备类型（Linux 常用 tun，面向三层 IP）。
dev             tun
#===== 基本模式 结束 =====

#===== 工作目录与相对路径 开始 =====
# 设定工作目录，后续相对路径（证书/密钥文件）将基于此目录解析。
# 注意：只影响文件查找，不影响脚本环境变量替换；日志/状态仍使用绝对路径更清晰。
cd /data/etc/openvpn/qd.research.virtual
#===== 工作目录与相对路径 结束 =====

#===== 连接与重试策略 开始 =====
# DNS 解析失败后等待 60 秒再重试（避免过于频繁的解析请求）。
resolv-retry    60

# TCP 连接失败（握手未建立）时两次尝试之间的间隔秒数。
connect-retry   15

# 最大连接重试次数：0 表示无限重试直到成功。
connect-retry-max 0

# 保活机制：每 1 秒发送控制通道 ping，30 秒未收到对端任何回应即重启会话。
# 等价于：ping 1 + ping-restart 30，加速失联检测。
keepalive 1 30
#===== 连接与重试策略 结束 =====

#===== 认证与证书 开始 =====
# CA 证书，用于验证服务器端证书链。
ca              ca.openvpn.vpn.crt

# 客户端证书（公钥证书）。
cert            qd.research.virtual.crt

# 客户端私钥（需妥善保护权限 600）。
key             qd.research.virtual.key
#===== 认证与证书 结束 =====

#===== 日志与状态输出 开始 =====
# 运行状态文件（会周期性写入当前连接与统计信息）。
status          /data/var/log/openvpn/qd.research.virtual/qd.research.virtual.status.txt

# 主日志文件（新的会覆盖，结合 log-append 使用可持续追加）。
log             /data/var/log/openvpn/qd.research.virtual/qd.research.virtual.txt

# 追加写方式的日志（存在时不截断）。
log-append      /data/var/log/openvpn/qd.research.virtual/qd.research.virtual.txt
#===== 日志与状态输出 结束 =====

#===== 持久化与性能 开始 =====
# 在重连时保持私钥句柄，不必重新加载（避免频繁读取磁盘）。
persist-key

# 在重连时保持 TUN 设备，不释放内核虚拟接口（减少路由抖动）。
persist-tun

# 启用 LZO 压缩（注意新版本常建议关闭压缩以减少 VORACLE 风险；需与服务端匹配）。
comp-lzo
#===== 持久化与性能 结束 =====

#===== 安全与加密策略 开始 =====
# 验证远端证书的用途为 server，增加 MITM 防护。
remote-cert-tls server

# 调试与排错的详细程度（0-11，生产建议 <=4；当前 9 很详细，日志会很大）。
verb            9

# 以低权限用户运行（初始需要 root 建立隧道，之后降权）。
user            nobody

# 进程所属用户组（配合 user 降权）。
group           nogroup

# 指定 TLS 密码套件策略；@SECLEVEL=0 降低最低安全级以兼容旧证书/算法。
tls-cipher      DEFAULT:@SECLEVEL=0
#===== 安全与加密策略 结束 =====